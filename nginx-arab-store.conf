# ============================================================
# إعداد Nginx كـ reverse proxy أمام موقعك (gunicorn شغال على 127.0.0.1:5000)
# ضعه بـ: /etc/nginx/sites-available/arab-store
# ثم: sudo ln -s /etc/nginx/sites-available/arab-store /etc/nginx/sites-enabled/
# مجهّز لدومين: arab4store.com
# ============================================================

server {
    listen 80;
    server_name arab4store.com www.arab4store.com;

    # يسمح لـ certbot يتحقق من ملكية الدومين قبل ما يصدر شهادة SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name arab4store.com www.arab4store.com;

    # هيدول المسارين بيتعبّوا تلقائياً بعد ما تشغّل certbot (خطوة تحت)
    ssl_certificate     /etc/letsencrypt/live/arab4store.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arab4store.com/privkey.pem;

    client_max_body_size 20M;  # حتى ترفع صور المنتجات/البانر بدون ما نغيّر

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
